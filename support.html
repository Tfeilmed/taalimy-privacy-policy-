<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez le support de Taalimy pour obtenir de l'aide.">
  <title>Support - Taalimy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 36px 24px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h1 { color: #1769e0; margin-bottom: 12px; }
    p { line-height: 1.7; color: #4b5563; }
    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      background: #1769e0;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    .button:hover { background: #1256bb; }
    .small { margin-top: 24px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Support Taalimy</h1>
    <p>
      Besoin d'aide concernant Taalimy ?
      Notre équipe est disponible pour répondre à vos questions
      et vous aider à résoudre les problèmes rencontrés.
    </p>
    <p>Contactez-nous sur WhatsApp :</p>
    <a class="button"
       href="https://wa.me/22227201543"
       target="_blank"
       rel="noopener noreferrer">
      Contacter le support
    </a>
    <p class="small">Taalimy — Assistance aux utilisateurs</p>
  </main>
</body>
</html>
